# mihomo engine config — the WhiteVPN technique on the X28:
# all known nodes in one url-test group, health-checked every 60s,
# automatic failover to whichever node carries traffic. Rules mirror the
# xray split config (domestic direct, international + filtered via tunnel).
mixed-port: 1080
redir-port: 12345
allow-lan: true
bind-address: 192.168.70.1
mode: rule
log-level: warning
geodata-mode: true
geodata-loader: standard
geo-auto-update: false
external-controller: 127.0.0.1:9090
tun:
  enable: true
  stack: gvisor
  auto-route: false
  auto-detect-interface: true
  device: utun
  dns-hijack: []

dns:
  enable: true
  listen: 127.0.0.1:5353
  ipv6: false
  default-nameserver:
    - 10.201.112.252
  nameserver:
    - "https://8.8.8.8/dns-query#auto"

proxy-providers:
  rescue-pool:
    type: file
    path: /data/proxy/mihomo/rescue-pool.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 60
proxies:
  - name: vps-reality
    type: vless
    server: 85.121.124.158
    port: 443
    uuid: 5ee543a7-9a11-4d0d-b3e6-153945539f60
    network: tcp
    udp: true
    tls: true
    servername: www.bing.com
    client-fingerprint: chrome
    reality-opts:
      public-key: fIZg5mhL-DlLT03aBciQw94x6hPOe2_T6ivsRHRyMWA
      short-id: 7fa7e3ce4165cba3

  - name: cdn-ws
    type: vless
    server: 188.114.98.0
    port: 443
    uuid: 5ee543a7-9a11-4d0d-b3e6-153945539f60
    network: ws
    tls: true
    servername: cdn.dmbz.ir
    ws-opts:
      path: /v1/status
      headers:
        Host: cdn.dmbz.ir

  - name: babaii
    flow: xtls-rprx-vision
    type: vless
    server: 216.45.52.132
    port: 23993
    uuid: c5716edc-2be0-40d8-cb8a-866f5ce785b6
    network: tcp
    udp: true
    tls: true

  - name: hy2
    type: hysteria2
    server: 85.121.124.158
    port: 31800
    password: p4DyJIAuyp
    obfs: salamander
    obfs-password: bwne4pabf0tzt00f
    skip-cert-verify: true

proxy-groups:
  - name: auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 60
    tolerance: 100
    proxies:
      - vps-reality
      - cdn-ws
      - hy2
      - babaii

  - name: rescue
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 60
    tolerance: 100
    use:
      - rescue-pool
  - name: world
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 60
    proxies:
      - auto
      - rescue
rule-providers:
  steam-voice:
    type: file
    behavior: classical
    path: /data/proxy/mihomo/steam-voice.yaml
rules:
  - DOMAIN-SUFFIX,ir,DIRECT
  - DOMAIN-SUFFIX,iau.ir,DIRECT
  - DOMAIN-SUFFIX,srbiau.ac.ir,DIRECT
  - DOMAIN-KEYWORD,amoozesh,DIRECT
  - DOMAIN-SUFFIX,saymyname.website,DIRECT
  - DOMAIN-SUFFIX,dariasepehr.com,DIRECT
  - IP-CIDR,89.39.208.0/24,DIRECT,no-resolve
  - IP-CIDR,185.137.27.122/32,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  # C&C Red Alert 3 / Generals Evolution (RA3BattleNet / GameSpy)
  - DOMAIN-SUFFIX,ra3battle.net,auto
  - DOMAIN-SUFFIX,ra3battle.cn,auto
  - DOMAIN-SUFFIX,cor-games.com,auto
  - DOMAIN-SUFFIX,gamespy.com,auto
  - DOMAIN-SUFFIX,gamestats.com,auto
  - DOMAIN-SUFFIX,cnc-online.net,auto
  - DST-PORT,6667,auto
  - DST-PORT,28910,auto
  - DST-PORT,29900,auto
  - DST-PORT,29901,auto
  - DST-PORT,27900,auto
  - DST-PORT,27901,auto
  - DST-PORT,6500,auto
  - DST-PORT,8086,auto
  - DST-PORT,8087,auto
  - DST-PORT,13139,auto
  - GEOIP,IR,DIRECT
  - GEOSITE,youtube,auto
  - GEOSITE,google,auto
  - GEOSITE,instagram,auto
  - GEOSITE,facebook,auto
  - RULE-SET,steam-voice,hy2
  - MATCH,world

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
